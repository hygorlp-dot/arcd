<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b2e">
  <meta property="og:image" content="https://marcelleng.com.br/assets/brand/marcell-avatar-512.png">
  <title>MARCELL | Converse sobre sua obra</title>
  <link rel="icon" href="assets/brand/marcell-avatar-512.png">
  <style>
    @font-face { font-family: Nimbus; src: url("assets/fonts/nimbussans-regular-latin.woff2"); font-display: swap; }
    @font-face { font-family: Nimbus; src: url("assets/fonts/nimbussans-bold-latin.woff2"); font-weight: 700; font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f0e9; color: #0d1b2e; font: 1rem/1.45 Nimbus, Arial, sans-serif; }
    main { max-width: 31rem; margin: auto; padding: clamp(1rem, 4vw, 2rem); }
    header { display: grid; grid-template-columns: 42% 58%; height: clamp(10rem, 36vw, 13rem); grid-template-rows: minmax(0, 1fr); background: #0d1b2e; border-radius: 4px; overflow: hidden; }
    h1 { margin: 0; padding: 20px; align-self: center; }
    h1 img { display: block; width: 100%; height: auto; }
    .house { width: 100%; height: 100%; min-height: 0; object-fit: cover; }
    h2 { font: normal clamp(1.65rem, 5vw, 2.15rem)/1.15 Georgia, serif; margin: 1.6rem 0 .65rem; }
    p { margin: 0 0 1.2rem; color: #505a65; }
    nav { display: grid; }
    a { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.4rem; padding: .8rem .2rem; border-bottom: 1px solid #c9c2b3; color: inherit; text-decoration: none; }
    .contact { background: #0d1b2e; color: white; border: 0; border-radius: 4px; padding: 1rem; margin-bottom: .5rem; font-weight: 700; }
    .contact span { color: #d4bd8f; }
    a:hover { text-decoration: underline; text-underline-offset: .22em; }
    a:focus-visible { outline: 3px solid #946d29; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1><img src="assets/brand/marcell-completa-ouro.svg" width="300" height="277" alt="MARCELL Engenharia &amp; Construção"></h1>
      <img class="house" src="assets/img/casa-supreme-bio.png" alt="Fachada da Casa Supreme">
    </header>
    <h2>Vamos conversar sobre sua obra?</h2>
    <p>Projetos e construção de casas em Caruaru.</p>
    <nav aria-label="Contato e links da MARCELL">
      <a class="contact" href="https://wa.me/5581995254340?text=Ol%C3%A1%2C%20vim%20pelo%20Instagram%20da%20MARCELL%20e%20quero%20conversar%20sobre%20minha%20obra.">Falar com a equipe pelo WhatsApp <span aria-hidden="true">↗</span></a>
      <a href="https://marcelleng.com.br/#portfolio">Conhecer os projetos <span aria-hidden="true">→</span></a>
      <a href="https://marcelleng.com.br/#avaliacoes">Ver depoimentos de clientes <span aria-hidden="true">→</span></a>
      <a href="https://marcelleng.com.br/">Visitar o site da MARCELL <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
